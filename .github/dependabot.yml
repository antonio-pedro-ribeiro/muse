version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # pinned by git commit; Dependabot mistakes it for PyPI's unrelated "openmuse" and fails to resolve
      - dependency-name: openmuse
    groups:
      minor-and-patch:
        update-types: [minor, patch]
