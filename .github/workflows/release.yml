name: Release

# Push a tag vX.Y.Z (matching `version` in pyproject.toml) to publish a GitHub Release with the wheel, the sdist
# and SHA256SUMS. A PEP 440 pre-release version (0.2.0rc1, tag v0.2.0rc1) makes a pre-release. Nothing is published to PyPI: the
# OpenMuse dependency is a git URL, which PyPI does not accept (and PyPI's "openmuse" is a different project).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches the package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.6"
      - name: Compare
        shell: bash
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8      # exactly the files CI built and smoke-tested
        with:
          name: dist
          path: dist/
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "muse-monitor $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]*$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
