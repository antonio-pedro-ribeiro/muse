[project]
name = "muse-monitor"
version = "0.1.0"
description = "Monitor and analyze Muse S Athena EEG recordings"
authors = [
    { name = "antonio-pedro-ribeiro", email = "antonio-pedro-ribeiro@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2",
    "openmuse",
    "pyarrow>=17",
    "pydantic>=2.7",
    "rich>=13",
    "scipy>=1.13",
    "typer>=0.12",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]

[project.optional-dependencies]
models = [
    "braindecode>=1.2",
    "huggingface-hub>=0.24",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "torch>=2.5",
]

[project.scripts]
muse = "muse_monitor.interfaces.cli:main"
muse-check = "muse_monitor.check:main"

[project.entry-points."muse_monitor.plugins"]
synthetic = "muse_monitor.plugins.synthetic:Synthetic"
openmuse = "muse_monitor.plugins.openmuse:OpenMuseSource"
replay = "muse_monitor.plugins.replay:Replay"
quality = "muse_monitor.plugins.quality:Quality"
filter = "muse_monitor.plugins.filter:Filter"
baseline = "muse_monitor.plugins.baseline:Baseline"
bandpower = "muse_monitor.plugins.bandpower:BandPower"
artifacts = "muse_monitor.plugins.artifacts:Artifacts"
cbramod = "muse_monitor.plugins.cbramod:CBraMod"
recorder = "muse_monitor.plugins.recorder:Recorder"
export = "muse_monitor.plugins.export:Export"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
openmuse = { git = "https://github.com/DominiqueMakowski/OpenMuse" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["device: needs a real Muse headband (skipped unless -m device)"]
addopts = "-m 'not device'"
